      - article [ref=e58]:
        - heading "Searching by Author Name" [level=4] [ref=e60]
        - list [ref=e62]:
          - listitem [ref=e63]:
            - text: Using the
            - strong [ref=e64]: Author(s) field
            - text: produces best results for author name searches.
          - listitem [ref=e65]:
            - text: For the most precise name search, follow
            - strong [ref=e66]: surname(s), forename(s)
            - text: or
            - strong [ref=e67]: surname(s), initial(s)
            - text: "pattern: example Hawking, S or Hawking, Stephen"
          - listitem [ref=e68]:
            - text: For best results on multiple author names,
            - strong [ref=e69]: separate individuals with a ;
            - text: "(semicolon). Example: Jin, D S; Ye, J"
          - listitem [ref=e70]:
            - text: Author names enclosed in quotes will return only
            - strong [ref=e71]: exact matches
            - text: . For example, "Stephen Hawking" will not return matches for Stephen W. Hawking.
          - listitem [ref=e72]: Diacritic character variants are automatically searched in the Author(s) field.
          - listitem [ref=e73]: Queries with no punctuation will treat each term independently.
      - article [ref=e74]:
        - heading "Searching by subcategory" [level=4] [ref=e76]
        - list [ref=e78]:
          - listitem [ref=e79]:
            - text: To search within a subcategory select
            - strong [ref=e80]: All fields
            - text: .
          - listitem [ref=e81]:
            - text: A subcategory search can be combined with an author or keyword search by clicking on
            - strong [ref=e82]: add another term
            - text: in advanced search.
      - heading "Tips" [level=2] [ref=e83]
      - paragraph [ref=e84]: "Wildcards:"
      - list [ref=e85]:
        - listitem [ref=e86]: Use ? to replace a single character or * to replace any number of characters.
        - listitem [ref=e87]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
      - paragraph [ref=e88]: "Expressions:"
      - list [ref=e89]:
        - listitem [ref=e90]: TeX expressions can be searched, enclosed in single $ characters.
      - paragraph [ref=e91]: "Phrases:"
      - list [ref=e92]:
        - listitem [ref=e93]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
      - paragraph [ref=e94]: "Dates:"
      - list [ref=e95]:
        - listitem [ref=e96]:
          - text: Sorting by announcement date will use the year and month the
          - emphasis [ref=e97]: original version
          - text: (v1) of the paper was announced.
        - listitem [ref=e98]:
          - text: Sorting by submission date will use the year, month and day the
          - emphasis [ref=e99]: latest version
          - text: of the paper was submitted.
      - paragraph [ref=e100]: "Journal References:"
      - list [ref=e101]:
        - listitem [ref=e102]:
          - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
          - strong [ref=e103]: math*
          - text: will match
          - emphasis [ref=e104]: math
          - text: ","
          - emphasis [ref=e105]: maths
          - text: ","
          - emphasis [ref=e106]: mathematics
          - text: .
        - listitem [ref=e107]:
          - text: If a journal reference search does
          - strong [ref=e108]: not
          - text: contain a wildcard, only exact phrases entered will be matched. For example,
          - strong [ref=e109]: math
          - text: would match
          - emphasis [ref=e110]: math
          - text: or
          - emphasis [ref=e111]: math and science
          - text: but not
          - emphasis [ref=e112]: maths
          - text: or
          - emphasis [ref=e113]: mathematics
          - text: .
        - listitem [ref=e114]:
          - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
          - strong [ref=e115]: Physica A
          - text: will match all papers with journal references containing
          - emphasis [ref=e116]: Physica A
          - text: ", but a search for"
          - strong [ref=e117]: Physica A, 245 (1997) 181
          - text: will only return the paper with journal reference
          - emphasis [ref=e118]: Physica A, 245 (1997) 181
          - text: .
