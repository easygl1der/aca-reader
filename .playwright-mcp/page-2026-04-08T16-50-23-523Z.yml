          - article [ref=e177]:
            - heading "Searching by Author Name" [level=4] [ref=e179]
            - list [ref=e181]:
              - listitem [ref=e182]:
                - text: Using the
                - strong [ref=e183]: Author(s) field
                - text: produces best results for author name searches.
              - listitem [ref=e184]:
                - text: For the most precise name search, follow
                - strong [ref=e185]: surname(s), forename(s)
                - text: or
                - strong [ref=e186]: surname(s), initial(s)
                - text: "pattern: example Hawking, S or Hawking, Stephen"
              - listitem [ref=e187]:
                - text: For best results on multiple author names,
                - strong [ref=e188]: separate individuals with a ;
                - text: "(semicolon). Example: Jin, D S; Ye, J"
              - listitem [ref=e189]:
                - text: Author names enclosed in quotes will return only
                - strong [ref=e190]: exact matches
                - text: . For example, "Stephen Hawking" will not return matches for Stephen W. Hawking.
              - listitem [ref=e191]: Diacritic character variants are automatically searched in the Author(s) field.
              - listitem [ref=e192]: Queries with no punctuation will treat each term independently.
          - article [ref=e193]:
            - heading "Searching by subcategory" [level=4] [ref=e195]
            - list [ref=e197]:
              - listitem [ref=e198]:
                - text: To search within a subcategory select
                - strong [ref=e199]: All fields
                - text: .
              - listitem [ref=e200]:
                - text: A subcategory search can be combined with an author or keyword search by clicking on
                - strong [ref=e201]: add another term
                - text: in advanced search.
          - heading "Tips" [level=2] [ref=e202]
          - paragraph [ref=e203]: "Wildcards:"
          - list [ref=e204]:
            - listitem [ref=e205]: Use ? to replace a single character or * to replace any number of characters.
            - listitem [ref=e206]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
          - paragraph [ref=e207]: "Expressions:"
          - list [ref=e208]:
            - listitem [ref=e209]: TeX expressions can be searched, enclosed in single $ characters.
          - paragraph [ref=e210]: "Phrases:"
          - list [ref=e211]:
            - listitem [ref=e212]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
          - paragraph [ref=e213]: "Dates:"
          - list [ref=e214]:
            - listitem [ref=e215]:
              - text: Sorting by announcement date will use the year and month the
              - emphasis [ref=e216]: original version
              - text: (v1) of the paper was announced.
            - listitem [ref=e217]:
              - text: Sorting by submission date will use the year, month and day the
              - emphasis [ref=e218]: latest version
              - text: of the paper was submitted.
          - paragraph [ref=e219]: "Journal References:"
          - list [ref=e220]:
            - listitem [ref=e221]:
              - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
              - strong [ref=e222]: math*
              - text: will match
              - emphasis [ref=e223]: math
              - text: ","
              - emphasis [ref=e224]: maths
              - text: ","
              - emphasis [ref=e225]: mathematics
              - text: .
            - listitem [ref=e226]:
              - text: If a journal reference search does
              - strong [ref=e227]: not
              - text: contain a wildcard, only exact phrases entered will be matched. For example,
              - strong [ref=e228]: math
              - text: would match
              - emphasis [ref=e229]: math
              - text: or
              - emphasis [ref=e230]: math and science
              - text: but not
              - emphasis [ref=e231]: maths
              - text: or
              - emphasis [ref=e232]: mathematics
              - text: .
            - listitem [ref=e233]:
              - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
              - strong [ref=e234]: Physica A
              - text: will match all papers with journal references containing
              - emphasis [ref=e235]: Physica A
              - text: ", but a search for"
              - strong [ref=e236]: Physica A, 245 (1997) 181
              - text: will only return the paper with journal reference
              - emphasis [ref=e237]: Physica A, 245 (1997) 181
              - text: .
