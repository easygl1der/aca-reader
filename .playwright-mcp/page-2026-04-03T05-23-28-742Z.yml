                        - code [ref=e3850]: "\\documentclass[12pt]{article} \\usepackage{amsmath, amssymb, amsthm} \\usepackage{ctex} % 支持中文 \\usepackage{geometry} \\geometry{a4paper, margin=1in} \\begin{document} \\section*{均值差估计量 (Difference-in-Means Estimator)} 对于给定的均值差估计量： $$ \\hat{\\tau}_{DM} = \\bar{Y}_T - \\bar{Y}_C $$ \\subsection*{1. 该估计量的直观理解} 在 Neyman-Rubin 因果模型中，令 $Y_i(1)$ 和 $Y_i(0)$ 为潜在结果。平均处理效应 (ATE) 定义为 $\\tau = \\mathbb{E}[Y_i(1) - Y_i(0)]$。在完全随机化实验中，处理分配 $Z_i$ 独立于潜在结果，即 $Z_i \\perp\\!\\!\\!\\perp (Y_i(1), Y_i(0))$。 因此，样本均值是总体期望的无偏估计： $$ \\mathbb{E}[\\bar{Y}_T] = \\mathbb{E}[Y_i | Z_i=1] = \\mathbb{E}[Y_i(1)] $$ $$ \\mathbb{E}[\\bar{Y}_C] = \\mathbb{E}[Y_i | Z_i=0] = \\mathbb{E}[Y_i(0)] $$ 直观上，$\\hat{\\tau}_{DM}$ 就是用观测到的样本均值差，作为总体平均处理效应 (ATE) 的经验类比 (empirical analog)。 \\subsection*{2. 忽略分层可能导致的效率损失} 当存在处理前协变量 $X_i$ 时，潜在结果通常与 $X_i$ 存在相关性。根据全方差公式 (Law of Total Variance)： $$ Var(Y(z)) = \\mathbb{E}[Var(Y(z) \\mid X)] + Var(\\mathbb{E}[Y(z) \\mid X]) $$ 如果不采用分层，估计量的方差依赖于边际方差 $Var(Y(z))$，包含了 $X$ 能够解释的组间变异。如果我们在实验设计阶段进行区组随机化 (blocking) 或在分析时进行分层，估计量的方差将主要依赖于条件方差 $\\mathbb{E}[Var(Y(z) \\mid X)]$。 因此，忽略分层相当于将协变量携带的有效信息混入误差项中，导致残差方差增大，进而损失了估计量的渐近效率。 \\subsection*{3. 与简单 OLS 回归 $Y \\sim Z$ 的关系} 考虑一元线性回归模型： $$ Y_i = \\alpha + \\beta Z_i + \\varepsilon_i $$ 使用普通最小二乘法 (OLS) 求解时，对应的正规方程为： \\begin{align} \\sum_{i=1}^n Y_i &= n\\hat{\\alpha} + n_T\\hat{\\beta} \\\\ \\sum_{i: Z_i=1} Y_i &= n_T\\hat{\\alpha} + n_T\\hat{\\beta} \\end{align} 由方程 (2) 除以 $n_T$ 可得 $\\bar{Y}_T = \\hat{\\alpha} + \\hat{\\beta}$。 由方程 (1) 减去方程 (2) 可得控制组的总和： $$ \\sum_{i: Z_i=0} Y_i = (n - n_T)\\hat{\\alpha} = n_C\\hat{\\alpha} \\implies \\bar{Y}_C = \\hat{\\alpha} $$ 代入前式即得： $$ \\hat{\\beta}_{OLS} = \\bar{Y}_T - \\bar{Y}_C = \\hat{\\tau}_{DM} $$ 因此，简单 OLS 回归估计出的斜率系数，在代数上完全等价于均值差估计量。 \\end{document}"
