<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大黑AI速报</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>

    <div class="mobile-wrapper">
        <!-- 顶部 Banner -->
        <header class="banner">
            <div class="banner-bg-logos-img" id="banner-logos"></div>
            <div class="banner-bg-logos" id="banner-bg-text"></div>
            <div class="banner-info">
                <img src="dahei.jpg" alt="大黑" class="banner-avatar">
                <h1 class="banner-title">大黑AI速报</h1>
                <p class="banner-date" id="issue-date">加载中...</p>
            </div>
        </header>

        <!-- AI 总结 -->
        <section class="ai-summary">
            <span class="section-label">◆ AI 总结</span>
            <p class="summary-content" id="ai-summary">加载中...</p>
        </section>

        <!-- 分类内容 -->
        <div id="content-blocks"></div>

        <!-- 页脚 -->
        <footer class="footer">
            <div>由<a href="https://daheiai.com/" target="_blank" class="footer-link-subtle">人工大黑</a>制作</div>
            <div class="footer-source" id="footer-source"></div>
            <div class="footer-links">
                <a href="index.html">历史期刊</a>
                <a href="rss.php" target="_blank">RSS 订阅</a>
            </div>
        </footer>
    </div>

    <script>
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file') || 'quick_2026-03-29_2000';

        // Logo 映射
        const logoMap = {
            openai: "images/logos/openai.png",
            claude: "images/logos/claude.png",
            kimi: "images/logos/kimi.png",
            minimax: "images/logos/minimax.png",
            deepseek: "images/logos/deepseek.png"
        };

        // 转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 加载内容
        async function loadContent() {
            try {
                const response = await fetch(`https://news.daheiai.com/realtime.php?file=${file}`);
                const html = await response.text();

                // 解析 HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // 提取日期
                const dateEl = doc.querySelector('.banner-date');
                if (dateEl) {
                    document.getElementById('issue-date').textContent = dateEl.textContent;
                }

                // 提取 AI 总结
                const summaryEl = doc.querySelector('.summary-content');
                if (summaryEl) {
                    document.getElementById('ai-summary').innerHTML = DOMPurify.sanitize(summaryEl.innerHTML);
                }

                // 提取内容区块
                const contentBlocks = doc.querySelectorAll('.content-block');
                const contentContainer = document.getElementById('content-blocks');

                contentBlocks.forEach(block => {
                    const category = block.querySelector('.category-header');
                    const articles = block.querySelectorAll('.article-item');

                    let html = `<section class="content-block">`;
                    if (category) {
                        html += `<h2 class="category-header">${escapeHtml(category.textContent)}</h2>`;
                    }

                    articles.forEach(article => {
                        const meta = article.querySelector('.article-meta');
                        const title = article.querySelector('.article-title');
                        const body = article.querySelector('.article-body');

                        html += `<article class="article-item">`;

                        if (meta) {
                            const logos = meta.querySelectorAll('.article-logo');
                            const keywords = meta.querySelector('.article-keywords');

                            html += `<div class="article-meta">`;
                            if (logos.length) {
                                html += `<div class="article-logos">`;
                                logos.forEach(logo => {
                                    const src = logo.src.split('/').pop();
                                    const mappedSrc = logoMap[src.replace('.png', '')] || logo.src;
                                    html += `<img src="${mappedSrc}" alt="${escapeHtml(src)}" class="article-logo">`;
                                });
                                html += `</div>`;
                            }
                            if (keywords) {
                                html += `<span class="article-keywords">${escapeHtml(keywords.textContent)}</span>`;
                            }
                            html += `</div>`;
                        }

                        if (title) {
                            html += `<h3 class="article-title">${escapeHtml(title.textContent)}</h3>`;
                        }

                        if (body) {
                            html += `<div class="article-body">${DOMPurify.sanitize(body.innerHTML)}</div>`;
                        }

                        html += `</article>`;
                    });

                    html += `</section>`;
                    contentContainer.innerHTML += html;
                });

                // 提取来源信息
                const footerSource = doc.querySelector('.footer-source');
                if (footerSource) {
                    document.getElementById('footer-source').textContent = footerSource.textContent;
                }

                // 更新页面标题
                const pageTitle = doc.querySelector('title');
                if (pageTitle) {
                    document.title = pageTitle.textContent;
                }

            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('content-blocks').innerHTML =
                    `<p style="padding:20px;text-align:center;color:#666;">加载失败，请刷新重试</p>`;
            }
        }

        loadContent();
    </script>
</body>
</html>
