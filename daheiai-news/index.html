        function createCard(item) {
            const logosHtml = item.logos.map(logo => {
                const src = logoMap[logo] || `images/logos/${logo}.png`;
                return `<img src="${src}" alt="${logo}" class="card-logo" onerror="this.style.display='none'">`;
            }).join('');

            return `
                <a href="${item.url}" class="card">
                    <div class="card-header">
                        <span class="card-issue">第 ${item.id} 期</span>
                        <span class="card-time">${item.time}</span>
                    </div>
                    <div class="card-summary">${item.summary}</div>
                    <div class="card-footer">
                        <div class="card-logos">${logosHtml}</div>
                        <span class="card-count">${item.count} 条快讯</span>
                    </div>
                </a>
            `;
        }

        function renderCards() {
            const grid = document.getElementById('waterfall-grid');
            const loading = document.getElementById('loading');

            newsData.forEach(item => {
                grid.innerHTML += createCard(item);
            });

            loading.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', renderCards);
