          - generic [ref=e82]:
            - heading "What is prompt injection?" [level=1] [ref=e83]
            - generic [ref=e84]:
              - paragraph [ref=e85]: Prompt injection is a security vulnerability that occurs when an attacker manipulates the input to a large language model (LLM) to cause unintended behavior. Unlike traditional code injection, prompt injection targets the application's use of the LLM rather than the model itself.
              - paragraph [ref=e86]: "The attack works by crafting inputs that include malicious instructions designed to override the system's original instructions. These can be delivered through:"
              - paragraph [ref=e87]: • User-provided text inputs • Data from external sources used in prompt construction • Third-party content integrated into prompts
              - paragraph [ref=e88]: Common attack vectors include the injection of commands disguised as user instructions, the extraction of sensitive information through carefully constructed queries, and the manipulation of model outputs for malicious purposes.
              - paragraph [ref=e89]: Defensive measures should include input validation, output filtering, and the use of separate contexts for trusted and untrusted content.
